name: Product request
description: Suggest a product improvement or integration.
title: "[request] "
labels: ["request", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Envoy is not an agent framework, model provider, scheduler, sandbox, or source-code merge engine. Requests are most useful when they describe the coordination problem you are trying to solve.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent/session/machine boundary are you trying to cross?
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Desired shape
      description: What would the Envoy behavior or integration look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: What are you doing today?
